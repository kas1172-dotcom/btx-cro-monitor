name: Deploy Pages
description: Build the cockpit, assemble the Pages artifact, and deploy it.

inputs:
  vite_backend_endpoint:
    description: Backend endpoint exposed to the Vite build.
    required: true
  vite_clerk_publishable_key:
    description: Browser-safe Clerk publishable key.
    required: true
  clerk_environment:
    description: Clerk instance type expected by this deployment (development or production).
    required: false
    default: production
  deployment_mode:
    description: Explicit deployment truth (demo or production).
    required: true

outputs:
  page_url:
    description: Deployed GitHub Pages URL.
    value: ${{ steps.deploy.outputs.page_url }}

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # Publish the latest tip of the branch, including artifacts committed by
        # an earlier job in the same workflow run.
        ref: ${{ github.ref_name }}

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc

    - name: Build Enterprise Brain cockpit
      working-directory: frontend
      shell: bash
      env:
        VITE_BACKEND_ENDPOINT: ${{ inputs.vite_backend_endpoint }}
        VITE_COPILOT_ENDPOINT: ${{ inputs.vite_backend_endpoint }}/llm
        VITE_CLERK_PUBLISHABLE_KEY: ${{ inputs.vite_clerk_publishable_key }}
        CLERK_DEPLOYMENT_ENVIRONMENT: ${{ inputs.clerk_environment }}
        VITE_DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
        VITE_DEPLOYED_REVISION: ${{ github.sha }}
        VITE_BASE_PATH: /btx-cro-monitor/cockpit/
        VITE_TENANT_ID: btx-demo-command-cockpit
        VITE_SOURCE_TYPE: repository_seed
        VITE_DATA_PROVENANCE: Repository demo seed; internal records are illustrative
        RELEASE_GATE_STRICT_NODE: "1"
      run: |
        if [ -z "$VITE_BACKEND_ENDPOINT" ] || [ -z "$VITE_CLERK_PUBLISHABLE_KEY" ]; then
          echo "::error::Missing one or more frontend deploy secrets: VITE_BACKEND_ENDPOINT, VITE_CLERK_PUBLISHABLE_KEY"
          exit 1
        fi
        npm ci
        env -u VITE_CLERK_PUBLISHABLE_KEY npm run test:release-critical
        npm run validate:production-env
        npm run build
        npm run smoke:deployment

    - name: Assemble site
      shell: bash
      run: |
        rm -rf _site && mkdir -p _site/cockpit _site/btx
        cp -r frontend/dist/. _site/cockpit/
        # Pages has no SPA rewrite, so a deep link such as
        # /btx-cro-monitor/cockpit/accounts/<id> would 404. Serving the app shell
        # as 404.html lets the client router take over. This only works because
        # the build uses an absolute base, so assets resolve from any depth.
        #
        # Pages only honours a 404.html at the root of the published site, not
        # one inside a subdirectory, so the site-root copy is the one that does
        # the work. The cockpit copy is kept for local previews of this layout.
        cp _site/cockpit/index.html _site/cockpit/404.html
        cp _site/cockpit/index.html _site/404.html
        for artifact in run_output.json archive.json map_targets.json; do
          test -f "clients/btx/artifacts/$artifact"
          cp "clients/btx/artifacts/$artifact" "_site/btx/$artifact"
        done
        cat > _site/index.html <<'HTML'
        <!doctype html>
        <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>BTX CRO Monitor</title>
            <style>
              body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f6f7f9; }
              main { max-width: 760px; margin: 14vh auto; padding: 0 24px; }
              h1 { font-size: clamp(2rem, 6vw, 4rem); line-height: 1; margin: 0 0 16px; }
              p { color: #526071; font-size: 1.05rem; line-height: 1.6; }
              nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
              a { border: 1px solid #cdd5df; border-radius: 8px; color: #172033; padding: 12px 16px; text-decoration: none; background: #fff; }
              a:first-child { background: #172033; border-color: #172033; color: #fff; }
            </style>
          </head>
          <body>
            <main>
              <h1>BTX CRO Monitor</h1>
              <p>The live backend-connected cockpit is published from this repository. Monitor JSON artifacts are available under <code>/btx/</code> for the cockpit.</p>
              <nav aria-label="BTX pages">
                <a href="./cockpit/">Open cockpit</a>
                <a href="./btx/run_output.json">View monitor JSON</a>
              </nav>
            </main>
          </body>
        </html>
        HTML

    - name: Configure Pages
      uses: actions/configure-pages@v5
      with:
        enablement: true

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site

    - name: Deploy to GitHub Pages
      id: deploy
      uses: actions/deploy-pages@v4
