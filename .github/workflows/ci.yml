name: 01 CI

# Gates every PR into main: frontend typecheck/build/test suites, backend
# pytest, and an optional browser E2E smoke job. No network/paid API calls are
# made by the default jobs; Anthropic-backed test paths are mocked.
#
# Browser E2E is skipped by default. Set repository variable RUN_E2E=1 to enable
# it; this keeps ordinary PRs fast while preserving a single CI workflow in the
# Actions tab.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Node version
        run: npm run doctor:node
        env:
          RELEASE_GATE_STRICT_NODE: "1"

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Development dependency risk acceptance
        run: npm run audit:dev-risk

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Assert demo and production environment rules
        run: |
          env VITE_BACKEND_ENDPOINT=https://api.example.test VITE_CLERK_PUBLISHABLE_KEY=pk_test_ci CLERK_DEPLOYMENT_ENVIRONMENT=development VITE_DEPLOYMENT_MODE=demo VITE_DEPLOYED_REVISION=779198f npm run validate:production-env
          if env VITE_BACKEND_ENDPOINT=https://api.example.test VITE_CLERK_PUBLISHABLE_KEY=pk_test_ci CLERK_DEPLOYMENT_ENVIRONMENT=development VITE_DEPLOYMENT_MODE=production VITE_DEPLOYED_REVISION=779198f npm run validate:production-env; then
            echo "::error::Production accepted Clerk development credentials."
            exit 1
          fi

      - name: test:environment-gate
        run: npm run test:environment-gate

      - name: check:design
        run: npm run check:design

      - name: check:voice
        run: npm run check:voice

      - name: test:metrics
        run: npm run test:metrics

      - name: test:canonical-metrics
        run: npm run test:canonical-metrics

      - name: test:metric-availability
        run: npm run test:metric-availability

      - name: test:rail
        run: npm run test:rail

      - name: test:settings
        run: npm run test:settings

      - name: test:tour
        run: npm run test:tour

      - name: test:phase0
        run: npm run test:phase0

      - name: test:architecture
        run: npm run test:architecture

      - name: test:correctness
        run: npm run test:correctness

      - name: test:routing
        run: npm run test:routing

      - name: test:route-data
        run: npm run test:route-data

      - name: test:navigation
        run: npm run test:navigation

      - name: test:actions
        run: npm run test:actions

      - name: test:settings-a11y
        run: npm run test:settings-a11y

      - name: test:a11y-axe
        run: npm run test:a11y-axe

      - name: test:page-improvements
        run: npm run test:page-improvements

      - name: test:mobile-workflow
        run: npm run test:mobile-workflow

      - name: test:control-harness
        run: npm run test:control-harness

      - name: test:identity
        run: npm run test:identity

      - name: test:map
        run: npm run test:map

      - name: test:deliverables
        run: npm run test:deliverables

      - name: test:deliverable-library
        run: npm run test:deliverable-library

      - name: test:wizard
        run: npm run test:wizard

      - name: test:hubspot-viewer
        run: npm run test:hubspot-viewer

      - name: test:import-list
        run: npm run test:import-list

      - name: test:assistant
        run: npm run test:assistant

      - name: test:ask-quality
        run: npm run test:ask-quality

      - name: test:evidence
        run: npm run test:evidence

      - name: test:mobile
        run: npm run test:mobile

      - name: smoke:deployment
        run: npm run smoke:deployment

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install engine + platform
        run: pip install -e ".[dev,platform]"

      - name: Secret and artifact scan
        run: python3 tooling/secret_scan.py

      - name: pytest
        run: python3 -m pytest -q

      - name: Environment contract and revision parity
        run: python3 tooling/verify_deployment_parity.py --contract-only
        env:
          BTX_DEPLOYMENT_MODE: demo
          BTX_TENANT_ID: btx-demo-command-cockpit
          BTX_DEPLOYED_REVISION: 779198f

  e2e:
    if: ${{ vars.RUN_E2E == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: npm run test:e2e
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          E2E_CLERK_EMAIL: ${{ secrets.E2E_CLERK_EMAIL }}
          E2E_CLERK_PASSWORD: ${{ secrets.E2E_CLERK_PASSWORD }}
          E2E_CLERK_LOGIN: ${{ vars.E2E_CLERK_LOGIN }}
          E2E_HUBSPOT_TEST_PORTAL: ${{ secrets.E2E_HUBSPOT_TEST_PORTAL }}
          E2E_BACKEND_ENDPOINT: ${{ secrets.E2E_BACKEND_ENDPOINT }}
          E2E_CLERK_SESSION_TOKEN: ${{ secrets.E2E_CLERK_SESSION_TOKEN }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: /tmp/btx-e2e-smoke
          retention-days: 14
